spring:
  application:
    name: orderflow-api
  datasource:
    url: jdbc:h2:mem:orderflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  cache:
    type: caffeine
    cache-names: products
    caffeine:
      spec: maximumSize=200,expireAfterWrite=5m
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    listener:
      auto-startup: false
  jackson:
    default-property-inclusion: non_null
  task:
    scheduling:
      pool:
        size: 2

server:
  port: 8080
  shutdown: graceful
  error:
    include-message: never

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: OrderFlow
    description: Event-driven order management platform
    version: 0.1.0

springdoc:
  swagger-ui:
    path: /docs
    operations-sorter: method
  api-docs:
    path: /api-docs

orderflow:
  auth:
    demo-email: ${DEMO_USER_EMAIL:demo@orderflow.dev}
    demo-password: ${DEMO_USER_PASSWORD:Demo123!}
    display-name: Nithish Demo
    jwt-secret: ${JWT_SECRET:orderflow-local-development-secret-32-characters}
    token-ttl: 8h
  events:
    transport: local
    relay-enabled: true
    topic: orders.placed.v1
    max-attempts: 3
  cors:
    allowed-origins: http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:orderflow}
    username: ${POSTGRES_USER:orderflow}
    password: ${POSTGRES_PASSWORD:orderflow}
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:redpanda:9092}
    listener:
      auto-startup: true
    consumer:
      group-id: orderflow-fulfillment
      auto-offset-reset: earliest

orderflow:
  events:
    transport: kafka
