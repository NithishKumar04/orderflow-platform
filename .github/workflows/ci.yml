name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        working-directory: backend
        run: ./mvnw --batch-mode verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Test
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
      - name: Audit production dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  topology:
    name: Distributed topology smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Start topology
        run: docker compose up --build --detach
      - name: Wait for readiness
        run: |
          for attempt in {1..36}; do
            if curl --fail --silent http://localhost:8080/actuator/health/readiness >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1
      - name: Complete an event-driven order
        run: |
          login="$(curl --fail --silent http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"demo@orderflow.dev","password":"Demo123!"}')"
          token="$(jq --raw-output '.token' <<<"$login")"
          product_id="$(curl --fail --silent http://localhost:8080/api/products \
            | jq --raw-output '.[0].id')"
          order="$(curl --fail --silent http://localhost:8080/api/orders \
            -H "Authorization: Bearer $token" \
            -H 'Idempotency-Key: ci-topology-order-001' \
            -H 'Content-Type: application/json' \
            -d "{\"items\":[{\"productId\":\"$product_id\",\"quantity\":1}],\"paymentMethod\":\"DEMO_APPROVED\"}")"
          order_id="$(jq --raw-output '.id' <<<"$order")"

          for attempt in {1..20}; do
            status="$(curl --fail --silent "http://localhost:8080/api/orders/$order_id" \
              -H "Authorization: Bearer $token" | jq --raw-output '.status')"
            if [[ "$status" == "CONFIRMED" ]]; then
              curl --fail --silent http://localhost:3000 >/dev/null
              exit 0
            fi
            sleep 1
          done
          docker compose logs backend redpanda
          exit 1
      - name: Stop topology
        if: always()
        run: docker compose down --volumes
